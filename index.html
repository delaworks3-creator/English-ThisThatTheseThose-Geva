<!DOCTYPE html><!-- English Game Geva -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>This That These Those - Geva</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e3f2fd, #fce4ec);
  margin: 0;
  padding: 20px;
  text-align: center;
}

.box {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 28px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.18);
}

h1 {
  color: #1565c0;
  font-size: 38px;
  margin: 10px 0;
}

.subtitle {
  color: #6a1b9a;
  font-size: 23px;
  font-weight: bold;
}

.from {
  font-size: 20px;
  margin: 12px;
  color: #444;
}

.info {
  background: #fff3cd;
  padding: 15px;
  border-radius: 18px;
  font-size: 19px;
  margin: 20px 0;
}

.progress {
  font-size: 20px;
  font-weight: bold;
  color: #555;
  margin-top: 15px;
}

.question {
  font-size: 28px;
  font-weight: bold;
  margin: 25px 5px;
  line-height: 1.5;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.options button {
  font-size: 24px;
  padding: 18px;
  border: none;
  border-radius: 18px;
  background: #90caf9;
  cursor: pointer;
}

.options button:active {
  transform: scale(0.96);
}

.feedback {
  font-size: 22px;
  font-weight: bold;
  margin: 20px;
  min-height: 30px;
}

.result {
  font-size: 25px;
  font-weight: bold;
}

.restart {
  background: #66bb6a;
  color: white;
  border: none;
  padding: 16px 28px;
  border-radius: 16px;
  font-size: 22px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="box">

<h1>🇬🇧 THIS • THAT • THESE • THOSE</h1>

<div class="subtitle">
English Game
</div>

<div class="from">
💌 From Miss Dela to Geva de Fretes
</div>

<div class="info">
Choose the correct word.<br>
Think carefully! 🌟<br>
There are 30 questions.
</div>

<div id="game">

<div class="progress" id="progress"></div>

<div class="question" id="question"></div>

<div class="options">
<button onclick="answer(0)" id="a0"></button>
<button onclick="answer(1)" id="a1"></button>
<button onclick="answer(2)" id="a2"></button>
<button onclick="answer(3)" id="a3"></button>
</div>

<div class="feedback" id="feedback"></div>

</div>

<div class="result" id="result"></div>

</div>

<script>

var questions = [

{
question: "Look at ___ beautiful bird here on my hand.",
options: ["this", "that", "these", "those"],
answer: 0
},

{
question: "___ shoes over there belong to my brother.",
options: ["This", "That", "These", "Those"],
answer: 3
},

{
question: "I don't like ___ picture on the wall over there.",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "___ books beside me are very interesting.",
options: ["This", "That", "These", "Those"],
answer: 2
},

{
question: "Can you see ___ mountain in the distance?",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "___ is my favorite pencil. It is right here.",
options: ["This", "That", "These", "Those"],
answer: 0
},

{
question: "Who are ___ children playing in the park over there?",
options: ["this", "that", "these", "those"],
answer: 3
},

{
question: "Please give me ___ two notebooks next to you.",
options: ["this", "that", "these", "those"],
answer: 2
},

{
question: "What is ___ strange sound coming from the room over there?",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "___ cookies here are still warm.",
options: ["This", "That", "These", "Those"],
answer: 2
},

{
question: "I want to buy ___ bag in my hand.",
options: ["this", "that", "these", "those"],
answer: 0
},

{
question: "Are ___ your glasses on the table over there?",
options: ["this", "that", "these", "those"],
answer: 3
},

{
question: "___ isn't my house. My house is across the street.",
options: ["This", "That", "These", "Those"],
answer: 0
},

{
question: "___ aren't my books. They belong to Anna.",
options: ["This", "That", "These", "Those"],
answer: 3
},

{
question: "Why are ___ flowers next to me so beautiful?",
options: ["this", "that", "these", "those"],
answer: 2
},

{
question: "I can't reach ___ box on the top shelf over there.",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "___ is the answer I was looking for.",
options: ["This", "That", "These", "Those"],
answer: 0
},

{
question: "Look at ___ stars in the sky!",
options: ["This", "That", "These", "Those"],
answer: 3
},

{
question: "Could you move ___ chairs beside me?",
options: ["this", "that", "these", "those"],
answer: 2
},

{
question: "Who gave you ___ umbrella over there?",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "I have never seen ___ kind of insect before.",
options: ["this", "that", "these", "those"],
answer: 0
},

{
question: "___ are the students who won the competition.",
options: ["This", "That", "These", "Those"],
answer: 3
},

{
question: "Please don't touch ___ machine right here.",
options: ["this", "that", "these", "those"],
answer: 0
},

{
question: "Do you remember ___ old castle we visited last year?",
options: ["this", "that", "these", "those"],
answer: 1
},

{
question: "___ questions on this page are more difficult.",
options: ["This", "That", "These", "Those"],
answer: 2
},

{
question: "I think ___ is the key to the problem.",
options: ["this", "that", "these", "those"],
answer: 0
},

{
question: "Why did you choose ___ houses at the end of the street?",
options: ["this", "that", "these", "those"],
answer: 3
},

{
question: "___ information in this book is very useful.",
options: ["This", "That", "These", "Those"],
answer: 0
},

{
question: "I don't understand ___ words you wrote on the board over there.",
options: ["this", "that", "these", "those"],
answer: 3
},

{
question: "If you compare the two pictures, ___ one on the left is clearer.",
options: ["this", "that", "these", "those"],
answer: 1
}

];

var number = 0;
var score = 0;

function showQuestion() {

  document.getElementById("progress").innerHTML =
    "Question " + (number + 1) + " of 30";

  document.getElementById("question").innerHTML =
    questions[number].question;

  document.getElementById("a0").innerHTML =
    questions[number].options[0];

  document.getElementById("a1").innerHTML =
    questions[number].options[1];

  document.getElementById("a2").innerHTML =
    questions[number].options[2];

  document.getElementById("a3").innerHTML =
    questions[number].options[3];

  document.getElementById("feedback").innerHTML =
    "Choose your answer 👇";
}

function answer(choice) {

  if (choice === questions[number].answer) {

    score = score + 1;

    document.getElementById("feedback").innerHTML =
      "🎉 Correct! Excellent!";

  } else {

    document.getElementById("feedback").innerHTML =
      "😊 Not quite. Keep going!";
  }

  setTimeout(function() {

    number++;

    if (number < questions.length) {

      showQuestion();

    } else {

      var finalScore = Math.round((score / 30) * 100);

      document.getElementById("game").style.display = "none";

      document.getElementById("result").innerHTML =
        "<h2>🎊 Game Completed!</h2>" +
        "<p>Your Score</p>" +
        "<p style='font-size:48px; color:#1565c0;'>" +
        finalScore + " / 100</p>" +
        "<p>Great job, Geva! 🌟</p>" +
        "<p>💌 From Miss Dela</p>" +
        "<button class='restart' onclick='location.reload()'>🔄 Play Again</button>";
    }

  }, 800);
}

showQuestion();

</script>

</body>
</html>
